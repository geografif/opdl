<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Modern MapLibre + Oracle Cloud GeoJSON</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    
    <!-- MapLibre GL JS CSS & JS -->
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // 1. Initialize the MapLibre map with a clean open-source vector basemap
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://demotiles.maplibre.org/style.json', // Vector basemap
            center: [15.473, 49.817], // Centered around Czechia (CZ)
            zoom: 7
        });

        // 2. Add your Oracle Cloud GeoJSON dataset on map load
        map.on('load', () => {
            map.addSource('oracle-geojson-source', {
                type: 'geojson',
                // Pointing directly to your Oracle Cloud Object Storage GeoJSON file
                data: 'https://objectstorage.eu-stockholm-1.oraclecloud.com/n/axugepzdcbl1/b/geodata/o/geo.geojson' 
            });

            // 3. Render the polygon layer using hardware-accelerated WebGL
            map.addLayer({
                id: 'oracle-polygons-layer',
                type: 'fill',
                source: 'oracle-geojson-source',
                paint: {
                    'fill-color': '#2563eb', // Modern blue tone
                    'fill-opacity': 0.4,
                    'fill-outline-color': '#1e40af'
                }
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>MapLibre Satellite + Secure Proxy Polygons</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    
    <!-- MapLibre GL JS CSS & JS -->
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <!-- Turf.js for auto-centering and bounds calculation -->
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        /* UI Control styling for the layer toggle box */
        #layer-control {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 10px 14px;
            font-family: sans-serif;
            font-size: 14px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #layer-control label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- UI Control to show/hide the polygon layer -->
    <div id="layer-control">
        <label>
            <input type="checkbox" id="toggle-layer" checked> Show Polygons
        </label>
    </div>

    <script>
        // 1. Initialize MapLibre with Esri World Imagery Satellite Basemap
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    'satellite-basemap': {
                        type: 'raster',
                        tiles: [
                            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
                        ],
                        tileSize: 256,
                        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
                    }
                },
                layers: [
                    {
                        id: 'satellite-layer',
                        type: 'raster',
                        source: 'satellite-basemap',
                        minzoom: 0,
                        maxzoom: 22
                    }
                ]
            },
            center: [0, 0],
            zoom: 2
        });

        // 2. Fetch GeoJSON securely through your Cloudflare Worker proxy (hiding your direct bucket URL)
        const secureProxyUrl = 'https://spring-truth-8d27.m-afif-fau.workers.dev';

        map.on('load', async () => {
            try {
                const response = await fetch(secureProxyUrl);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();

                // Add the GeoJSON source to the map
                map.addSource('secure-geojson-source', {
                    type: 'geojson',
                    data: data
                });

                // Add the transparent polygon fill layer with visible outlines
                map.addLayer({
                    id: 'polygons-layer',
                    type: 'fill',
                    source: 'secure-geojson-source',
                    paint: {
                        'fill-color': '#ff7800',        // Base fill color (hidden by 0 opacity)
                        'fill-opacity': 0.0,            // Completely transparent inside to reveal satellite imagery
                        'fill-outline-color': '#ffff00' // High-visibility bright yellow border lines
                    }
                });

                // Automatically calculate bounding box and fly map directly to your data
                const bbox = turf.bbox(data);
                map.fitBounds(bbox, { padding: 50, maxZoom: 15 });

            } catch (error) {
                console.error("Error loading geospatial data via proxy:", error);
            }

            // 3. Hook up the Show/Hide Checkbox Control
            const checkbox = document.getElementById('toggle-layer');
            checkbox.addEventListener('change', (e) => {
                const visibility = e.target.checked ? 'visible' : 'none';
                map.setLayoutProperty('polygons-layer', 'visibility', visibility);
            });
        });
    </script>
</body>
</html>
